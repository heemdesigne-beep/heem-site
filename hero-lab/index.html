<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>HEEM — تجربة الهيرو</title>
<style>
@font-face{font-family:Palestine;src:url(/assets/approved/9ef6f703eb9f9b53.otf) format('opentype');font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;background:#070b2a;color:#fff;font-family:Palestine,system-ui,sans-serif}
a{color:inherit;text-decoration:none}
.hs{position:relative;height:340vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:radial-gradient(1100px 700px at 75% 40%,#1a2a8c 0,#0b1250 45%,#070b2a 100%)}
.glow{position:absolute;inset:0;background:radial-gradient(520px 520px at var(--cx) var(--cy),rgba(110,135,255,calc(.45*(1 - var(--p2)))),transparent 70%)}
.photo{position:absolute;inset:0;clip-path:circle(var(--r) at var(--cx) var(--cy));will-change:clip-path}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:28% 50%;transform-origin:var(--ox) var(--oy);transform:translate(calc(var(--bx)*(1 - var(--p2)) + var(--mx)*-14px),calc(var(--by)*(1 - var(--p2)) + var(--my)*-10px)) scale(var(--sc));will-change:transform}
.ring{position:absolute;left:var(--cx);top:var(--cy);width:calc(var(--rp)*2 + 70px);height:calc(var(--rp)*2 + 70px);margin:calc(var(--rp)*-1 - 35px) 0 0 calc(var(--rp)*-1 - 35px);border-radius:50%;border:1px dashed rgba(190,205,255,.55);opacity:calc(1 - var(--p2)*3);animation:spin 28s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{position:absolute;left:var(--cx);top:calc(var(--cy) + var(--rp) + 62px);transform:translateX(-50%);font-size:18px;color:#c9d3ff;opacity:calc(1 - var(--p2)*6);white-space:nowrap}
header{position:absolute;top:0;left:0;right:0;z-index:7;display:flex;align-items:center;justify-content:space-between;padding:calc(var(--b)*7.5vh + 22px) 5vw 0}
.logo{width:84px;height:68px;background:#fff;-webkit-mask:url(/assets/heem-logo.png) center/contain no-repeat;mask:url(/assets/heem-logo.png) center/contain no-repeat}
nav{display:flex;gap:34px;font-size:20px;color:#e6ebff;transition:color .3s}
header.light nav{color:#111c50}header.light .logo{background:#111c50}.logo{transition:background .3s}
.name{position:absolute;right:6vw;top:50%;transform:translateY(-50%);z-index:3;pointer-events:none}
.name h1{margin:0;font-weight:400;font-size:clamp(64px,min(11vw,15.5vh),190px);line-height:1.18}
.name .w{display:block;will-change:transform,opacity,filter}
.w1{transform:translate3d(calc(var(--n)*-38vw),calc(var(--n)*-12vh),0);opacity:calc(1 - var(--n)*1.25);filter:blur(calc(var(--n)*14px))}
.w2{transform:translate3d(calc(var(--n)*30vw),calc(var(--n)*12vh),0);opacity:calc(1 - var(--n)*1.25);filter:blur(calc(var(--n)*14px));color:#9fb2ff}
.sub{margin-top:3.2vh;font-size:clamp(20px,2.6vw,38px);color:#c9d3ff;opacity:calc(1 - var(--n)*2.2)}
.cta{margin-top:3vh;display:flex;gap:14px;opacity:calc(1 - var(--n)*2.2);pointer-events:auto}
.btn{display:inline-flex;align-items:center;min-height:54px;padding:0 30px;border-radius:999px;font-size:21px;background:linear-gradient(135deg,#4a63ff,#303fc5);box-shadow:0 0 40px rgba(93,120,255,.55)}
.ghost{background:rgba(255,255,255,.08);border:1px solid rgba(190,205,255,.45);box-shadow:none}
.final{position:absolute;right:6vw;top:50%;transform:translateY(-50%);z-index:4;color:#111c50;max-width:46vw;opacity:var(--f);transform:translateY(calc(-50% + (1 - var(--f))*40px))}
.final p{margin:0;font-size:clamp(28px,3.6vw,56px);color:#1a2670}
.final h2{margin:.1em 0 .35em;font-weight:400;font-size:clamp(54px,8.6vw,136px);line-height:1.04;color:#111c50}
.final .btn{color:#fff}
.bar{position:absolute;left:0;right:0;height:calc(var(--b)*7.5vh);background:#000;z-index:6}
.bar.t{top:0}.bar.b{bottom:0}
.next{min-height:100vh;display:grid;place-items:center;text-align:center;padding:10vh 6vw;background:#070b2a}
.next h3{font-weight:400;font-size:clamp(36px,6vw,90px);margin:0 0 .4em}
.next p{color:#aab6ee;font-size:24px;margin:0}
@media (max-width:760px){
 nav{display:none}
 .name{right:50%;top:30%;transform:translate(50%,-50%);text-align:center;width:90vw}
 .final{right:5vw;left:5vw;max-width:none;text-align:center}
 .cta{justify-content:center}
}
@media (prefers-reduced-motion:reduce){
 .hs{height:auto}.stage{height:auto;min-height:100svh;position:relative}
 .photo{clip-path:none;opacity:.5}.name{position:relative;margin:0;right:auto;padding:18vh 6vw 4vh}
 .final{position:relative;right:auto;transform:none;opacity:1;padding:4vh 6vw 12vh;max-width:none}.ring,.hint,.bar{display:none}
}
</style>
</head>
<body>
<section class="hs" id="hs">
 <div class="stage" id="stage">
  <div class="glow"></div>
  <div class="photo"><img src="/assets/approved/4c6db7b463c8c221.jpg" alt="محمد إبراهيم وسط حشد من الوجوه المتشابهة"></div>
  <div class="ring"></div>
  <div class="hint">مرّر لتدخل</div>
  <header id="hd">
   <span class="logo" role="img" aria-label="شعار هيم"></span>
   <nav><a href="/#selected">الأعمال</a><a href="/#about">عنّي</a><a href="/#services">الخدمات</a><a href="/#contact">تواصل معي</a></nav>
  </header>
  <div class="name">
   <h1><span class="w w1">محمد</span><span class="w w2">إبراهيم</span></h1>
   <div class="sub">وسط كل التشابه أصنع الاختلاف</div>
   <div class="cta"><a class="btn" href="/#selected">شاهد أعمالي</a><a class="btn ghost" href="/#contact">ناقش مشروعك معي</a></div>
  </div>
  <div class="final">
   <p>وسط كل التشابه</p>
   <h2>أصنع الاختلاف</h2>
   <a class="btn" href="/#selected">شاهد أعمالي</a>
  </div>
  <div class="bar t"></div><div class="bar b"></div>
 </div>
</section>
<section class="next"><div><h3>من هنا يكمل الموقع</h3><p>هذه تجربة للهيرو فقط — لم تُنشر على الموقع الحقيقي.</p></div></section>
<script>
(function(){
var hs=document.getElementById('hs'),st=document.getElementById('stage'),hd=document.getElementById('hd'),img=st.querySelector('.photo img');
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var mx=0,my=0,tx=0,ty=0,tick=false;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function seg(p,a,b){return clamp((p-a)/(b-a),0,1)}
function render(){
 tick=false;
 var vw=innerWidth,vh=innerHeight,mob=vw<760;
 var r=hs.getBoundingClientRect(),total=hs.offsetHeight-vh;
 var p=clamp(-r.top/total,0,1);
 var n=ease(seg(p,.02,.3));            // الاسم يتفكك
 var g=ease(seg(p,.12,.78));           // الدائرة تكبر
 var f=ease(seg(p,.74,.92));           // النص النهائي
 var b=ease(seg(p,.7,.88));            // الشريط السينمائي
 var IW=1672,IH=941,sc0=Math.max(vw/IW,vh/IH),posx=mob?clamp((445*sc0-vw/2)/Math.max(1,IW*sc0-vw),0,1):.28;
 var offX=(IW*sc0-vw)*posx,offY=(IH*sc0-vh)*.5,fx=445*sc0-offX,fy=355*sc0-offY;
 var r0=mob?Math.min(vw,vh)*.2:Math.min(vw,vh)*.19;
 var rmax=Math.hypot(vw,vh);
 var rad=r0+(rmax-r0)*Math.pow(g,1.35);
 var cx0=mob?vw*.5:fx, cy0=mob?vh*.66:fy;
 var cx=cx0+(vw*.5-cx0)*g, cy=cy0+(vh*.5-cy0)*g;
 var s=st.style;
 s.setProperty('--n',n);s.setProperty('--p2',g);s.setProperty('--f',f);s.setProperty('--b',b);
 s.setProperty('--r',rad+'px');s.setProperty('--cx',cx+'px');s.setProperty('--cy',cy+'px');s.setProperty('--rp',r0+'px');
 img.style.objectPosition=(posx*100).toFixed(2)+'% 50%';
 s.setProperty('--ox',fx+'px');s.setProperty('--oy',fy+'px');s.setProperty('--bx',(cx0-fx)+'px');s.setProperty('--by',(cy0-fy)+'px');
 hd.classList.toggle('light',g>.55);
 s.setProperty('--sc',(1.45-.45*g).toFixed(4));
 mx+=(tx-mx)*.08;my+=(ty-my)*.08;s.setProperty('--mx',mx.toFixed(3));s.setProperty('--my',my.toFixed(3));
 if(Math.abs(tx-mx)>.002||Math.abs(ty-my)>.002)req();
}
function req(){if(!tick){tick=true;requestAnimationFrame(render)}}
if(!reduce){
 addEventListener('scroll',req,{passive:true});addEventListener('resize',req);
 addEventListener('pointermove',function(e){tx=e.clientX/innerWidth*2-1;ty=e.clientY/innerHeight*2-1;req()},{passive:true});
 req();
}
})();
</script>
</body>
</html>
